name: github-actions-CI.yaml
on:
  push

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD:  postgres
        ports:
          - "5433:5432"
        options: >- #skleja linie w jedna 
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - "6380:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_TESTS: postgresql+psycopg2://postgres:postgres@localhost:5433/postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6380
      ALGORITHM: HS256
      SECRET_KEY: test-secret-key-aCFxKatP2mNoBjaUqFYScsQZ
      DUMMY_PASSWORD: test-dummy-password

    steps:
      - name: Fetch code from repository
        uses: actions/checkout@v7
      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run alembic migration
        run: alembic upgrade head
      - name: Test With Pytest
        run: pytest





